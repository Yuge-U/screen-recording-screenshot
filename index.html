<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<title>画面録画スクショ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{max-width:760px;margin:auto;padding:max(20px,env(safe-area-inset-top)) 16px 48px}h1{font-size:28px;margin:10px 0 6px}.sub{color:#666;line-height:1.55;margin:0 0 18px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 8px #0000000f}label{display:block;font-weight:700;margin-bottom:10px}input[type=file]{width:100%;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}.ctl{font-size:14px}.ctl input{width:100%}button{width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;margin-top:10px;background:#111;color:#fff}button.secondary{background:#e8e8ed;color:#111}button:disabled{opacity:.35}progress{width:100%;height:14px}.status{font-weight:700;margin-bottom:8px}.detail,.note{color:#666;font-size:13px;line-height:1.5}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.shot{border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 1px 6px #00000014}.shot img{width:100%;display:block}.shot div{padding:8px;font-size:13px}.shot a{display:block;text-align:center;padding:10px;text-decoration:none;color:#06c;font-weight:700}video{width:100%;max-height:250px;background:#000;border-radius:12px;margin-top:12px}@media(min-width:600px){.results{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body><main>
<h1>画面録画スクショ</h1>
<p class="sub">iPhoneの画面収録から、画面が変化したあと安定した場面を自動抽出します。動画は端末内で処理します。</p>
<section class="card">
<label>① 画面収録を選択</label>
<input id="file" type="file" accept="video/*">
<video id="video" playsinline muted preload="metadata" controls hidden></video>
</section>
<section class="card">
<label>② 抽出設定</label>
<div class="row">
<div class="ctl">判定間隔 <b id="intervalOut">0.30</b>秒<input id="interval" type="range" min=".15" max="1" step=".05" value=".30"></div>
<div class="ctl">安定感度 <b id="stableOut">3.0</b>%<input id="stable" type="range" min="1" max="10" step=".5" value="3"></div>
<div class="ctl">変化感度 <b id="changeOut">9</b>%<input id="change" type="range" min="3" max="25" step="1" value="9"></div>
<div class="ctl">重複判定 <b id="dupOut">4</b>%<input id="dup" type="range" min="1" max="12" step="1" value="4"></div>
</div>
<button id="start" disabled>解析開始</button>
<button id="stop" class="secondary" disabled>中止</button>
<p class="note">まず初期値で試してください。動画読込後に「解析開始」が有効になります。</p>
</section>
<section class="card"><div id="status" class="status">動画を選択してください</div><progress id="progress" max="100" value="0"></progress><div id="detail" class="detail"></div></section>
<section class="card"><label>③ 抽出結果 <span id="count">0枚</span></label><div id="results" class="results"></div></section>
<canvas id="full" hidden></canvas><canvas id="small" hidden></canvas>
<script src="./app.js"></script>
</main></body></html>
